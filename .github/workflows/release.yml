name: Release

# Publishing a release on GitHub (normally the draft that ci.yml creates) uploads its wheel to PyPI.
#
# PyPI trusts this workflow through trusted publishing, so no API token is stored anywhere: PyPI's
# publisher settings name this repository, this file (release.yml) and the `pypi` environment, and
# GitHub vouches for each run with a short-lived OIDC token. See "Releasing" in README.md.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest  # the publish action only runs on Linux
    environment:
      name: pypi
      url: https://pypi.org/project/download-apk/
    permissions:
      contents: read
      id-token: write  # lets the run ask GitHub for the OIDC token PyPI checks
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download the release's wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          wheel="download_apk-$version-py3-none-any.whl"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$wheel" --dir dist
          ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
