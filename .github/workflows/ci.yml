name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The tests replace apkeep with a fake, so the editable install skips compiling it.
      - name: Install the package and its test tools
        env:
          DOWNLOAD_APK_SKIP_APKEEP: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group test

      - name: Run the tests
        run: python -m pytest

  sdist:
    name: Build the source tarball
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # hatch_build.py dates every file with the commit and reads the links from `origin`, so rebuilding
      # this commit gives the same bytes.
      - name: Build the source tarball
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Wheel (${{ matrix.platform }})
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each wheel holds apkeep compiled for one OS and CPU, so each builds on a runner of that kind.
        include:
          - { platform: linux-x86_64, os: ubuntu-latest }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm }
          - { platform: macos-arm64, os: macos-latest }
          - { platform: macos-x86_64, os: macos-15-intel }
          - { platform: windows-x64, os: windows-latest }
          - { platform: windows-arm64, os: windows-11-arm }
    env:
      # One Rust release for every wheel; on Linux, pyproject.toml's before-all installs it in the container.
      RUST_TOOLCHAIN: "1.97.0"
      CIBW_ENVIRONMENT_PASS_LINUX: RUST_TOOLCHAIN
    steps:
      - uses: actions/checkout@v7  # for pyproject.toml's [tool.cibuildwheel]; the wheel builds from the tarball

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: sdist/

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      # Building from the tarball, as pip does when no wheel fits, also checks the tarball is complete.
      - name: Find the source tarball
        id: sdist
        shell: bash
        run: echo "path=$(ls sdist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - uses: pypa/cibuildwheel@v3.2.1
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          config-file: pyproject.toml
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [sdist, wheels]
    # Only for main: a pull request must never create a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write           # signs the attestation with a certificate for this workflow run
      attestations: write       # stores it with the repository
      artifact-metadata: write  # records the attested files
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: "{sdist,wheel-*}"
          path: dist/
          merge-multiple: true

      - name: Read the version from pyproject.toml
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if the release already exists
        id: existing
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Lists drafts too, since this token can write to the repository.
          if gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -qxF "$TAG"; then
            echo "Release $TAG already exists (published or draft): nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete the tag left by a deleted release
        if: steps.existing.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "Deleting tag $TAG, which has no release."
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$TAG"
          else
            echo "No tag $TAG to clean up."
          fi

      - name: Prepare the release files and notes
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The assets:
          # - one wheel per platform under its standard name; publishing the release uploads them to PyPI
          #   (release.yml);
          # - the source tarball under a fixed name, so the newest release installs without a version
          #   (compiling apkeep, so it needs Rust):
          #     pip install https://github.com/<owner>/<repo>/releases/latest/download/download-apk.tar.gz
          #   (pip and uv refuse a wheel whose file name has no real version, so the fixed name is a tarball).
          APKEEP_VERSION=$(sed -n 's/^APKEEP_VERSION = "\(.*\)"$/\1/p' hatch_build.py)
          mkdir assets
          cp dist/download_apk-"$VERSION"-*.whl assets/
          cp "dist/download_apk-$VERSION.tar.gz" assets/download-apk.tar.gz
          {
            echo "## Files"
            echo
            echo '| File | SHA-256 |'
            echo '|---|---|'
            (cd assets && sha256sum * | awk '{ printf "| `%s` | `%s` |\n", $2, $1 }')
            echo
            echo "Each wheel holds apkeep $APKEEP_VERSION compiled for its platform."
            echo "Rebuilding the tag with \`python -m build --sdist\` gives the same tarball."
            echo "\`download-apk.tar.gz\` is \`download_apk-$VERSION.tar.gz\` renamed."
            echo
            echo "Every file carries a signed build provenance attestation. To check where a file was built:"
            echo
            echo '```'
            echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY"
            echo '```'
          } > notes.md

      # A signed statement (SLSA build provenance, through Sigstore) that these exact files were built by
      # this workflow run, from this commit, in this repository. Free for public repositories.
      - name: Attest the release files
        if: steps.existing.outputs.exists == 'false'
        uses: actions/attest@v4
        with:
          subject-path: assets/*

      - name: Create the draft release
        if: steps.existing.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # The tag is created on the built commit when the draft is published. --notes is prepended to
          # the generated notes (the commits and pull requests since the previous release).
          gh release create "$TAG" assets/* --draft --title "$TAG" --target "$GITHUB_SHA" \
            --notes "$(cat notes.md)" --generate-notes
