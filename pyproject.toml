[build-system]
requires = ["hatchling==1.32.4"]  # pinned: a different hatchling may build different bytes
build-backend = "hatchling.build"

[project]
name = "download-apk"
version = "0.3.0"
description = "Search Google Play and download apps' APKs into versioned folders."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jeremy Morren" }]
keywords = ["android", "apk", "google-play", "download", "apkeep"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
# Filled in by hatch_build.py: the README with absolute links, and links pinned to this release's tag.
dynamic = ["readme", "urls"]
dependencies = [
    "google-play-scraper>=1.2.7,<2",  # search, and the current version before a download
    "patchright>=1.50",               # Google Play sign-in (drives your installed Chrome)
]

[project.scripts]
download-apk = "download_apk.cli:main"

# hatch_build.py: GitHub links and the README for PyPI, file dates from the last commit, and apkeep
# compiled into the wheel.
[tool.hatch.metadata.hooks.custom]
[tool.hatch.build.hooks.custom]

[tool.hatch.build]
# Where an editable install compiles apkeep. A wheel never takes that copy: hatch_build.py compiles one.
exclude = ["src/download_apk/bin/"]

# CI builds one wheel per platform in each platform's native runner. The wheel works with any Python 3,
# so one Python builds it. On Linux it builds in a manylinux_2_28 container (glibc 2.28: RHEL 8, Debian
# 10, Ubuntu 18.10 or later), and auditwheel checks apkeep only needs what that tag promises.
[tool.cibuildwheel]
build = "cp314-*"
skip = "*-musllinux_*"
archs = ["native"]
build-frontend = "build"
test-command = "download-apk --version"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# apkeep's Google Play client talks TLS through OpenSSL on Linux (Security.framework on macOS, SChannel on
# Windows), and manylinux allows no OpenSSL from the system, so auditwheel copies the container's
# OpenSSL into the wheel. Rust comes from rustup, at the version CI passes in RUST_TOOLCHAIN.
before-all = [
    "dnf install -y openssl-devel pkgconf-pkg-config",
    "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain ${RUST_TOOLCHAIN:-stable}",
]
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[dependency-groups]
test = ["pytest>=8", "hatchling==1.32.4"]  # hatchling: the tests import hatch_build.py

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not network"]
markers = [
    "network: talks to Google Play or the IP lookup service over the internet; run with -m network",
    "real_location: uses the real country detection instead of the tests' fake",
]
